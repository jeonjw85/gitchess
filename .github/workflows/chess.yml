name: GitChess

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      action:
        description: Refresh the current game or start a new one
        required: true
        default: new-game
        type: choice
        options:
          - refresh
          - new-game

concurrency:
  group: readme-chess
  cancel-in-progress: false

jobs:
  play:
    if: vars.CHESS_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Chess:'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Play
        id: play
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          AUTHOR: ${{ github.event.issue.user.login || github.actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$ACTION" in
              refresh) uv run play.py refresh "$REPO" ;;
              new-game) uv run play.py play "Chess: Start new game" "$AUTHOR" "$OWNER" "$REPO" ;;
              *) exit 1 ;;
            esac
            python3 -c "import json, sys; sys.exit(not json.load(open('/tmp/chess-result.json'))['ok'])"
          else
            uv run play.py play "$ISSUE_TITLE" "$AUTHOR" "$OWNER" "$REPO"
          fi
          python3 -c "import json; print('ok=' + str(json.load(open('/tmp/chess-result.json'))['ok']).lower())" >> "$GITHUB_OUTPUT"
      - name: Commit board
        if: steps.play.outputs.ok == 'true'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          AUTHOR: ${{ github.event.issue.user.login || github.actor }}
          ACTION: ${{ inputs.action }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README*.md data
          git add -A -- 'board-*.svg'
          git diff --cached --quiet && exit 0
          git commit -m "${ISSUE_TITLE:-Chess: $ACTION} by $AUTHOR"
          git push
      - name: Comment and close
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          COMMENT=$(python3 -c "import json; print(json.load(open('/tmp/chess-result.json'))['comment'])")
          gh issue comment "$ISSUE_NUMBER" --body "$COMMENT"
          gh issue close "$ISSUE_NUMBER" --reason completed
